<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素材</title>
<script>try { const t = localStorage.getItem('cs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) { /* ignore */ }</script>
<link rel="icon" href="/static/brand/app-icon.svg">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/materials/page.css">
<link rel="stylesheet" href="/sucai/sucai.css">
</head>
<body class="lib-body">
<header class="lib-top">
  <a class="lib-brand" href="/" title="回工作台"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M14 66 Q30 28 48 86" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/><path d="M48 86 Q76 88 106 22" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><circle cx="48" cy="86" r="9" class="lib-dot"/></svg><span>素材</span></a>
  <span class="lib-top-r"><button type="button" class="lib-theme" id="theme" title="切换深浅色" aria-label="切换深浅色">◐</button></span>
</header>

<main class="lib-main">
  <header class="lib-head">
    <h1>素材</h1>
    <p>出图、挑风格、看视频样片；丢一个链接让它学会新的。留下的素材卡、拆过的爆款、好网站也在这，看中了直接「加入选题」。</p>
  </header>
  <nav class="lib-tabs" id="libTabs" aria-label="素材分类"></nav>
  <p class="lib-why" id="libWhy" role="status"></p>
  <div id="libBody" aria-live="polite"></div>
  <!-- 10/20 素材 Agent 并进来：「学一个新的」这一栏是固定的一块，page.js 只在这块打开时轮询 -->
  <div id="learnPanel" hidden>
    <section class="ma-intake" aria-labelledby="maAskT">
      <h2 id="maAskT">丢给它，它自己学会。</h2>
      <p class="ma-lede">GitHub 仓库、X 帖子、网页、本机文件夹都行。它读完拆成一张张卡：这是什么、什么时候用、提示词原文、样片。点「留下」的卡会出现在「素材卡」。</p>
      <form class="ma-form" id="maForm">
        <input id="maInput" type="text" autocomplete="off" spellcheck="false" placeholder="https://github.com/… 或 ~/Downloads/某个文件夹" aria-label="链接或文件夹">
        <button type="submit" class="btn primary" id="maGo">学</button>
      </form>
      <button type="button" class="ma-link" id="maPasteToggle">读不到？直接粘正文</button>
      <textarea id="maPaste" rows="6" placeholder="把帖子或文章的正文粘在这里" hidden></textarea>
      <p class="ma-msg" id="maMsg" role="status" aria-live="polite"></p>
      <ol class="ma-jobs" id="maJobs" aria-label="正在学的"></ol>
    </section>

    <section class="ma-shelf" id="maShelf" hidden>
      <nav class="ma-sources" id="maSources" aria-label="学过的"></nav>
      <header class="ma-head" id="maHead"></header>
      <div class="ma-filters" id="maFilters" role="group" aria-label="筛选"></div>
      <div class="ma-grid" id="maGrid" aria-live="polite"></div>
    </section>
  </div>
</main>

<dialog class="ma-dlg" id="maDlg">
  <form method="dialog" class="ma-dlg-in">
    <header class="ma-dlg-head"><div><b id="maDlgTitle"></b><small id="maDlgSub"></small></div><button class="ma-x" value="close" aria-label="关上">×</button></header>
    <div class="ma-dlg-media" id="maDlgMedia"></div>
    <dl class="ma-dlg-meta" id="maDlgMeta"></dl>
    <div class="ma-dlg-bar"><span>提示词原文（一个字没改）</span><button type="button" class="btn ghost" id="maCopy">复制</button></div>
    <pre class="ma-prompt" id="maDlgPrompt"></pre>
  </form>
</dialog>

<div class="lib-toast" id="libToast" role="status" aria-live="polite"></div>
<script src="/sucai/make.js"></script>
<script src="/sucai/sucai.js"></script>
<script src="/materials/page.js"></script>
</body>
</html>
