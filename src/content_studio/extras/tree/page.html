<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识树</title>
<script>try { const t = localStorage.getItem('cs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) { /* ignore */ }</script>
<link rel="icon" href="/static/brand/app-icon.svg">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/tree/page.css">
</head>
<body class="kt-body">
<header class="kt-top">
  <a class="kt-brand" href="/" title="回工作台"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M14 66 Q30 28 48 86" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/><path d="M48 86 Q76 88 106 22" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><circle cx="48" cy="86" r="9" class="kt-dot"/></svg><span>知识树</span></a>
  <button type="button" class="kt-theme" id="theme" title="切换深浅色" aria-label="切换深浅色">◐</button>
</header>

<main class="kt-main">
  <section class="kt-intake" aria-labelledby="askT">
    <h1 id="askT">读一篇，长一枝。</h1>
    <p class="kt-lede">X 帖子、GitHub 仓库、网页都行。它读完只挑会改变以后做法的部分，并进下面某一枝；下次你提到这个领域，我先问对问题再动手。</p>
    <form class="kt-form" id="form">
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="https://x.com/… 或 https://github.com/…" aria-label="链接">
      <button type="submit" class="btn primary" id="go">内化</button>
    </form>
    <button type="button" class="kt-link" id="pasteToggle">读不到？直接粘正文</button>
    <textarea id="paste" rows="6" placeholder="把帖子或文章的正文粘在这里" hidden></textarea>
    <p class="kt-msg" id="msg" role="status" aria-live="polite"></p>
    <ol class="kt-jobs" id="jobs" aria-label="收过的"></ol>
  </section>

  <p class="kt-why" id="why" role="status"></p>
  <section class="kt-stage" id="stage" aria-label="知识树">
    <div class="kt-canvas" id="canvas"></div>
    <aside class="kt-panel" id="panel" aria-live="polite"></aside>
  </section>
</main>

<script src="/tree/page.js"></script>
</body>
</html>
